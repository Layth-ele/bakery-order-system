<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    App icon source. All PWA icons (favicon, Android, iOS, maskable) are
    generated from this file by `npm run generate:icons`.
    To use the bakery's real logo: replace this file (square, artwork kept
    inside the central ~70% so Android masks don't crop it) and re-run.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A7B50"/>
      <stop offset="1" stop-color="#5C4330"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D9AE"/>
      <stop offset="1" stop-color="#D4A574"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- loaf: domed top, flat base (kept inside the 80% maskable safe zone) -->
  <path d="M120 318 C120 214 180 166 256 166 C332 166 392 214 392 318
           C392 334 380 346 364 346 L148 346 C132 346 120 334 120 318 Z"
        fill="url(#crust)" stroke="#FBF6EE" stroke-width="10" stroke-linejoin="round"/>
  <!-- score marks -->
  <g stroke="#A8743F" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M196 236 L228 292"/>
    <path d="M246 214 L278 284"/>
    <path d="M296 236 L322 288"/>
  </g>
  <!-- base shadow line -->
  <path d="M164 370 L348 370" stroke="#FBF6EE" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
</svg>
