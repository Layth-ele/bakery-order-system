<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D4A574" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      PASS 3: CSP serves as a fallback for hosts that don't apply firebase.json
      headers (e.g. local preview). HTTP-header CSP is preferred for production
      because some CSP directives are header-only. Tightened from baseline:
      - Removed permissive script-src that included www.googletagmanager.com
        (analytics is loaded explicitly only when configured)
      - Added object-src 'none' and base-uri 'self' (clickjacking + base
        injection mitigations)
      - Added frame-ancestors 'none' (defense-in-depth alongside X-Frame-Options)
      - 'unsafe-inline' on style-src is required by Tailwind's runtime for
        injected styles; we keep it because the alternative (nonces) doesn't
        work with Vite's static HTML output
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com https://*.google.com https://maps.googleapis.com https://*.cloudfunctions.net wss://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://*.firebase.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />

    <title>Delight Bakehouse - Order Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
